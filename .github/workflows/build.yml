name: Build Mosquito Revenge

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Download modules
        run: go mod download

      - name: Compile WASM
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p site
          go build -trimpath -ldflags="-s -w" -o site/mosquito-revenge.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/wasm_exec.js
          cp web/index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download Go modules
        run: go mod download

      - name: Build Ebitengine Android library
        run: |
          mkdir -p mobile/android/app/libs
          go run github.com/hajimehoshi/ebiten/v2//cmd/ebitenmobile bind \
            -target android \
            -androidapi 23 \
            -javapkg com.example.mosquitorevenge \
            -o mobile/android/app/libs/mosquitorevenge.aar \
            ./mobile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Package APK
        run: gradle --no-daemon --stacktrace -p mobile/android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mosquito-revenge-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
