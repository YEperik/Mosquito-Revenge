name: Mosquito Revenge - CI and Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosquito-revenge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go checks and gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install Ebitengine Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxrender-dev \
            libxxf86vm-dev

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            go.mod
            main.go
            game/game.go
            game/draw.go
            game/game_test.go
            mobile/mobile.go
            web/index.html
            mobile/android/settings.gradle
            mobile/android/build.gradle
            mobile/android/gradle.properties
            mobile/android/app/build.gradle
            mobile/android/app/src/main/AndroidManifest.xml
            mobile/android/app/src/main/java/com/example/mosquitorevenge/MainActivity.java
            mobile/android/app/src/main/res/values/styles.xml
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required project file is missing or empty"
              exit 1
            fi
          done
          echo "All required project files are present."

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(find . -type f -name '*.go' -not -path './mobile/android/*' -print)
          if ((${#go_files[@]} > 0)); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            if [[ -n "$unformatted" ]]; then
              echo "::error::Go files need gofmt:"
              printf '%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Run gameplay tests
        run: go test -v ./...

      - name: Verify desktop build
        run: go build -trimpath -o /tmp/mosquito-revenge .

  web:
    name: Build WebAssembly
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Compile WASM and package site
        shell: bash
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          set -euo pipefail
          test -s web/index.html
          mkdir -p site
          go build -trimpath -ldflags='-s -w' -o site/mosquito-revenge.wasm .
          WASM_EXEC="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          test -s "$WASM_EXEC"
          cp "$WASM_EXEC" site/wasm_exec.js
          cp web/index.html site/index.html
          test -s site/mosquito-revenge.wasm
          test -s site/wasm_exec.js
          test -s site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5

  android:
    name: Build Android debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$NDK_ROOT"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "Android SDK: $SDK_ROOT"
          echo "Android NDK: $NDK_ROOT"

      - name: Download Go modules
        run: go mod download

      - name: Generate Android library (AAR)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android/app/libs
          go run github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile bind \
            -target android \
            -androidapi 23 \
            -javapkg com.example.mosquitorevenge \
            -o mobile/android/app/libs/mosquitorevenge.aar \
            ./mobile
          test -s mobile/android/app/libs/mosquitorevenge.aar

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace -p mobile/android assembleDebug

      - name: Verify APK output
        run: test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mosquito-revenge-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
