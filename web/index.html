<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f192b">
  <title>Mosquito Revenge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f192b; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; }
    canvas { display: block; max-width: 100vw; max-height: 100dvh; object-fit: contain; touch-action: none; }
  </style>
</head>
<body>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const go = new Go();
      const response = await fetch("mosquito-revenge.wasm");
      let result;
      try {
        result = await WebAssembly.instantiateStreaming(response.clone(), go.importObject);
      } catch (_) {
        result = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
      }
      await go.run(result.instance);
    })().catch((error) => {
      document.body.innerHTML = "<pre style='color:#fff;padding:1rem'>Game failed to start: " + String(error) + "</pre>";
    });
  </script>
</body>
</html>
