<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f192b">
  <meta name="description" content="Mosquito Revenge - a tiny-winged top-down stealth arcade game.">
  <title>Mosquito Revenge</title>
  <style>
    :root { color-scheme: dark; background: #0f192b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f192b; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; }
    canvas { display: block; max-width: 100vw; max-height: 100dvh; object-fit: contain; touch-action: none; image-rendering: auto; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; color: #f8f0d9; font: 600 16px system-ui, sans-serif; text-align: center; }
    #loading small { color: #9ab0bf; font-weight: 400; }
  </style>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <div id="loading">MOSQUITO REVENGE<small>Loading tiny wings...</small></div>
  <script>
    (async () => {
      const loading = document.getElementById('loading');
      try {
        if (!globalThis.Go) throw new Error('Go WebAssembly runtime was not loaded.');
        const go = new Go();
        const response = await fetch('mosquito-revenge.wasm');
        if (!response.ok) throw new Error(`Cannot load WASM: HTTP ${response.status}`);
        let result;
        if (WebAssembly.instantiateStreaming) {
          try {
            result = await WebAssembly.instantiateStreaming(response.clone(), go.importObject);
          } catch (_) {
            result = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
          }
        } else {
          result = await WebAssembly.instantiate(await response.arrayBuffer(), go.importObject);
        }
        loading.remove();
        await go.run(result.instance);
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        const panel = loading.isConnected ? loading : document.createElement('div');
        panel.id = 'loading';
        panel.innerHTML = 'Game could not start<small></small>';
        panel.querySelector('small').textContent = message;
        if (!panel.isConnected) document.body.appendChild(panel);
        console.error(error);
      }
    })();
  </script>
</body>
</html>
