plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mosquitorevenge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.mosquitorevenge'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation files('libs/mosquitorevenge.aar')
}
